name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: relayforge
          POSTGRES_PASSWORD: relayforge
          POSTGRES_DB: relayforge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U relayforge -d relayforge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://relayforge:relayforge@localhost:5432/relayforge_test
      TEST_REDIS_URL: redis://localhost:6379/1
      PRISMA_HIDE_UPDATE_MESSAGE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build shared package
        run: pnpm --filter @relayforge/shared build

      - name: Generate Prisma client
        run: pnpm --filter @relayforge/api exec prisma generate

      # Applies migrations in global setup, then runs every *.int-spec.ts serially.
      - name: Run integration tests
        run: pnpm --filter @relayforge/api test:integration

      - name: Verify migrations match schema.prisma
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: pnpm --filter @relayforge/api db:check-drift

  compose:
    name: Docker Compose end to end
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7

      # Exactly the documented flow: copy the example environment and start everything.
      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up --build --detach --wait --wait-timeout 300

      - uses: ./.github/actions/setup

      - name: Build shared package for the demo scripts
        run: pnpm --filter @relayforge/shared build

      - name: Send a signed event through ingestion, processing and delivery
        run: pnpm demo:event

      - name: Send concurrent duplicates and check idempotency
        run: pnpm demo:duplicate

      - name: Show service state and logs
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 200
